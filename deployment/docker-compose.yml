# RTACE local stack.
#
#   Infrastructure only (run the Python services on the host):
#     docker compose -f deployment/docker-compose.yml up -d
#
#   Everything in containers (infrastructure + detection, containment, API, simulator):
#     docker compose -f deployment/docker-compose.yml --profile app up -d --build
#
# Kafka runs in KRaft mode (no ZooKeeper). Data for Kafka, Redis, Prometheus and
# Grafana lives in named volumes and survives `docker compose down`; use
# `down -v` to wipe it.

services:
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    ports:
      - "9092:9092"
    environment:
      # --- KRaft single node: this broker is also the controller
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      # --- Listeners: 29092 for containers, 9092 for the host, 29093 controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      # --- Single-broker replication settings
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      # --- Throughput tuning
      KAFKA_NUM_NETWORK_THREADS: 4
      KAFKA_NUM_IO_THREADS: 8
      KAFKA_SOCKET_SEND_BUFFER_BYTES: 1048576
      KAFKA_SOCKET_RECEIVE_BUFFER_BYTES: 1048576
      KAFKA_MESSAGE_MAX_BYTES: 1048576
      KAFKA_LOG_FLUSH_INTERVAL_MESSAGES: 10000
      KAFKA_LOG_FLUSH_INTERVAL_MS: 1000
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  # Creates all topics with 16 partitions so multiple consumer processes can
  # run in parallel within the same consumer group (one partition per process).
  # Replication factor 1 is fine for a local single-broker setup.
  kafka-init:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command: |
      "
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic tx-events    --partitions 16 --replication-factor 1 &&
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic auth-events  --partitions 16 --replication-factor 1 &&
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic detections   --partitions 16 --replication-factor 1 &&
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic audit-log    --partitions 16 --replication-factor 1 &&
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic rtace-dlq    --partitions 4  --replication-factor 1 &&
      echo 'All topics created.'
      "
    restart: "no"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    # noeviction, not allkeys-lru: this Redis holds enforcement rules and
    # replay state. Under memory pressure it must refuse writes (the consumers
    # treat OOM as transient and stall visibly) rather than silently evict a
    # quarantine or a replay key. appendonly persists rules across restarts.
    command: >
      redis-server
      --maxmemory 2gb
      --maxmemory-policy noeviction
      --appendonly yes
      --appendfsync everysec
      --hz 20
      --tcp-backlog 511
      --tcp-keepalive 60
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  prometheus:
    image: prom/prometheus:v2.48.0
    ports:
      - "9090:9090"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:10.2.3
    ports:
      - "3000:3000"
    environment:
      GF_INSTALL_PLUGINS: ""
      # Set GRAFANA_ADMIN_* in deployment/.env (see .env.example). Defaults: admin / admin.
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_HTTP_PORT: 3000
      GF_PATHS_PROVISIONING: /etc/grafana/provisioning
    volumes:
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

  # ---------------------------------------------------------------- app profile
  # Python services, built from ../Dockerfile. Started only with --profile app.

  detection-engine:
    build: { context: .., dockerfile: Dockerfile }
    image: rtace:local
    profiles: [app]
    command: ["python", "-m", "detection_engine.consumer"]
    environment: &app-env
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      REDIS_HOST: redis
      RTACE_API_TOKEN: ${RTACE_API_TOKEN:-}
    ports:
      - "9091:9091"
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  containment-engine:
    image: rtace:local
    pull_policy: never  # built by detection-engine above; never try the registry
    profiles: [app]
    command: ["python", "-m", "containment_engine.consumer"]
    environment: *app-env
    ports:
      - "9094:9094"
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  api:
    image: rtace:local
    pull_policy: never  # built by detection-engine above; never try the registry
    profiles: [app]
    command: ["uvicorn", "api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment: *app-env
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Go synchronous decision service (gRPC :9095, HTTP+metrics :8090).
  decision-service:
    build: { context: .., dockerfile: decision-service/Dockerfile }
    image: rtace-decision:local
    profiles: [app]
    environment:
      REDIS_ADDR: redis:6379
    ports:
      - "9095:9095"
      - "8090:8090"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  simulator:
    image: rtace:local
    pull_policy: never  # built by detection-engine above; never try the registry
    profiles: [app]
    command: ["python", "-m", "simulator.transaction_simulator"]
    environment:
      <<: *app-env
      SIM_INTERVAL_SECONDS: ${SIM_INTERVAL_SECONDS:-0.5}
      # Ask the decision service before publishing each transaction, like a
      # payment authoriser would. Unset to publish without asking.
      SIM_DECISION_URL: ${SIM_DECISION_URL:-http://decision-service:8090/v1/decide}
    depends_on:
      detection-engine:
        condition: service_started
      containment-engine:
        condition: service_started
      decision-service:
        condition: service_started
    restart: unless-stopped

volumes:
  kafka-data:
  redis-data:
  prometheus-data:
  grafana-data:
