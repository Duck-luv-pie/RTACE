# Prometheus config for RTACE local development.
#
# One target per service, addressed as host.docker.internal:<port>. That name
# reaches Python/Go processes running on the host AND, because every service
# publishes its port, the same services when they run under `--profile app`.
# Do not add a second set of compose-service-name targets: the same process
# would be scraped twice and every sum() panel would double count.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "rtace-detection-engine"
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:9091"]

  - job_name: "rtace-containment-engine"
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:9094"]   # 9093 is the KRaft controller port on a local Kafka

  - job_name: "rtace-decision-service"
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8090"]

  - job_name: "rtace-api"
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8000"]
