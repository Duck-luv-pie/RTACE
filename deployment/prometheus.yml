# Prometheus config for RTACE local development.
#
# Two target sets are listed for each service: host.docker.internal:<port> for
# when the Python services run on the host, and the compose service name for
# when they run under `--profile app`. The containment engine uses 9094
# because 9093 is the KRaft controller port on a locally installed Kafka. Whichever is not running simply shows
# as DOWN on the Targets page.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "rtace-detection-engine"
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:9091"]
        labels: { runtime: host }
      - targets: ["detection-engine:9091"]
        labels: { runtime: compose }

  - job_name: "rtace-containment-engine"
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:9094"]
        labels: { runtime: host }
      - targets: ["containment-engine:9094"]
        labels: { runtime: compose }

  - job_name: "rtace-decision-service"
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8090"]
        labels: { runtime: host }
      - targets: ["decision-service:8090"]
        labels: { runtime: compose }

  - job_name: "rtace-api"
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8000"]
        labels: { runtime: host }
      - targets: ["api:8000"]
        labels: { runtime: compose }
